checkpoint_path: train_root_dir/Transformer_Diffusion/checkpoint/04-16-12PM-59-24/epoch=8216-loss=0.04870.ckpt

OPTION: 1

eval_output_path: log/ours/

generation:
  experiment_name: artus_no_refinement
  output_root: elog/final_output
  category_keyword: Table
  num_objects: 100
  selection_seed: 31
  repetitions: 5

t5_max_sentence_length: 512

# [ARTUS] Partial-noise refinement of the coarse geometry latent with the
# frozen text-conditioned prior, and feedback into the Existing Articulation
# Pathway (paper Sec. 3.3, Eq. 5-7).
latent_refinement:
  enabled: false       # false -> "coarse code, no refinement" control (Table 2b)
  rho_star: 250        # refinement depth: noise index in the 1000-step schedule; 0 bypasses refinement
  sampler_steps: 50    # retained reverse steps of the frozen prior
  feedback: true       # false -> "structure rectifier, no feedback" control (Table 2b)

# Generation caps (paper Algorithm 1). Defaults derive from the dataset:
# max_generation_rounds = max_count_token + 1, max_nodes = max_count_token.
# max_generation_rounds: 33
# max_nodes: 32

evaluation:
  sdf_model_path: null

gensdf_latentcode_evaluator:
  gensdf_model_path: null
  resolution: 16
  max_batch: 262144         # 2 ^ 18

number_of_trial: 20
save_output_dat: true
